<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A plain locomotive side view: body, cab, chimney, two wheels.
       Dark on light tabs, light on dark tabs. -->
  <style>
    .ink { fill: #222; }
    @media (prefers-color-scheme: dark) { .ink { fill: #eee; } }
  </style>
  <rect class="ink" x="3" y="12" width="18" height="9" rx="1" />
  <rect class="ink" x="19" y="7" width="10" height="14" rx="1" />
  <rect class="ink" x="6" y="7" width="4" height="5" />
  <circle class="ink" cx="9" cy="25" r="4" />
  <circle class="ink" cx="22" cy="25" r="4" />
</svg>
